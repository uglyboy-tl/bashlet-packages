# imagine 模型目录
#
# 默认源（imagine 运行时按 TTL 后台刷新到本地缓存）：
#   https://github.com/uglyboy-tl/bashlet-packages/raw/HEAD/packages/imagine/registry.toml
# 换源优先级：IMAGINE_REGISTRY_URL 环境变量 > 上面这行的默认值。
#
# 字段（每个 [providers.<名字>] 下）：
#   default_model      默认模型（--model 未指定时用）
#   default_ref_model  带 --ref 时的默认模型（缺省回退 default_model）
#   models             已知模型，空格分隔；缓存/离线时供 `imagine models` 用
#
# 手动编辑与 scripts/update-registry.sh（CI 定时）等价，均建议走 PR；
# 能力声明（size/ref/seed/n 等接口机制）不在这里，它们在 lib/providers/*.sh。

[providers.agnes]
default_model = "agnes-image-2.1-flash"
default_ref_model = "agnes-image-2.1-flash"
models = "agnes-image-2.1-flash agnes-image-2.0-flash agnes-image-2.5-flash"

[providers.cloudflare]
default_model = "@cf/black-forest-labs/flux-1-schnell"
default_ref_model = "@cf/black-forest-labs/flux-1-schnell"
models = "@cf/black-forest-labs/flux-1-schnell @cf/black-forest-labs/flux-2-dev"

[providers.google]
default_model = "gemini-2.5-flash-image"
default_ref_model = "gemini-2.5-flash-image"
models = "gemini-2.5-flash-image gemini-3-pro-image-preview gemini-3-pro-image gemini-3.1-flash-image-preview gemini-3.1-flash-image gemini-3.1-flash-lite-image"

[providers.dashscope]
default_model = "qwen-image-plus"
default_ref_model = "wan2.7-image-pro"
models = "qwen-image-2.1-pro qwen-image-3.0 qwen-image-3.0-pro qwen-image-2.0-pro qwen-image-2.0 qwen-image-2.0-pro-2026-06-22 qwen-image-2.0-pro-2026-04-22 qwen-image-2.0-pro-2026-03-03 qwen-image-2.0-2026-03-03 qwen-image-plus-2026-01-09 qwen-image-plus qwen-image-max qwen-image-edit-plus qwen-image qwen-image-edit qwen-image-edit-plus-2025-12-15 wan2.6-t2i wan2.5-t2i-preview wan2.7-image wan2.7-image-pro wan2.6-image wan2.2-t2i-plus wan2.2-t2i-flash wanx2.1-t2i-plus wanx2.1-t2i-turbo"

[providers.doubao]
default_model = "doubao-seedream-5-0-260128"
default_ref_model = "doubao-seedream-5-0-260128"
models = "doubao-seedream-3-0-t2i-250415 doubao-seedream-4-0-250828 doubao-seedream-4-5-251128 doubao-seedream-5-0-260128 doubao-seedream-4-0-20260415 doubao-seedream-5-0-pro-260628 doubao-seedream-5-0-flash-260915"

[providers.minimax]
default_model = "image-01"
default_ref_model = "image-01"
