# BinUp 公共包目录
#
# binup 默认从这个文件拉取包目录（BashDev 仓库的 raw 地址）：
#   https://github.com/uglyboy-tl/bashlet-packages/raw/HEAD/packages/binup/registry.toml
# 换源优先级：BINUP_REGISTRY_URL 环境变量 > 配置里的 registry_url > 上面的默认值
# 所以别人可以把自己的 registry.toml 放任意 URL，当第三方源用。
#
# 字段与 binup 本地配置同构，多一个 description 仅用于 search 展示。
# 用法：
#   binup search <关键词>      # 搜目录（默认 24 小时内用本地缓存）
#   binup add <包名>           # 把定义写进本地配置
#   binup update && binup upgrade <包名> && binup install <包名>

