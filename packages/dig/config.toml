[defaults]
limit = 20
period = "pastmonth"

# 需要代理的源（youtube / v2ex / polymarket / discourse / hf）走这里。
# 也可以不写在这里：环境变量 DIG_PROXY 优先，或写用户级 ~/.config/dig/config.toml。
# proxy.url = "http://127.0.0.1:7890"

[discourse]
# dig discourse 默认搜的实例（逗号分隔）；用 -s/--site 可临时换掉。
sites = "discuss.python.org,community.openai.com,discuss.huggingface.co,discuss.pytorch.org,users.rust-lang.org,meta.discourse.org,community.fly.io,discuss.elastic.co"
